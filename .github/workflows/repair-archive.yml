name: Repair archive (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -euo pipefail
          grep -c ' || Best Uncensored AI Models | ' data/archive.md
          sed -i 's/ || Best Uncensored AI Models | / |\n| Best Uncensored AI Models | /' data/archive.md
          if [ -n "$(tail -c1 data/archive.md)" ]; then echo >> data/archive.md; fi
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/archive.md
          git commit -m "Repair merged row"
          git push
